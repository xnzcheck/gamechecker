<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>XNZ CHECK</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #3a2a08 0%, #111 35%, #050505 75%);
      color: #fff;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    /* HEADER */

    .header {
      text-align: center;
      padding: 30px 15px 25px;
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 15px;
      border-radius: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(145deg, #ffd76a, #b8860b);
      color: #080808;

      font-size: 25px;
      font-weight: 900;

      box-shadow:
        0 0 25px rgba(255, 193, 7, 0.35);
    }

    .header h1 {
      font-size: 32px;
      letter-spacing: 3px;
      color: #ffd45a;
      text-shadow: 0 0 15px rgba(255, 196, 60, 0.35);
    }

    .header p {
      margin-top: 8px;
      color: #aaa;
      font-size: 14px;
    }

    /* MAIN CARD */

    .card {
      background: rgba(17, 17, 17, 0.96);
      border: 1px solid #5d450d;
      border-radius: 22px;
      padding: 22px;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.65),
        inset 0 1px rgba(255, 215, 90, 0.06);
    }

    .title {
      text-align: center;
      color: #ffd45a;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    /* GAME BUTTON */

    .games {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    .game-btn {
      flex: 1;
      border: 1px solid #4f3a0b;
      border-radius: 13px;
      padding: 14px 8px;

      background: #111;
      color: #aaa;

      font-size: 13px;
      font-weight: bold;
      cursor: pointer;

      transition: 0.2s;
    }

    .game-btn.active {
      background: linear-gradient(135deg, #ffd866, #b8860b);
      color: #080808;
      border-color: #ffd866;

      box-shadow:
        0 0 18px rgba(255, 200, 50, 0.25);
    }

    .game-btn:active {
      transform: scale(0.97);
    }

    /* FORM */

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d5d5d5;
      font-size: 13px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 15px;

      background: #080808;
      color: #fff;

      border: 1px solid #46360f;
      border-radius: 12px;

      outline: none;
      font-size: 15px;

      transition: 0.2s;
    }

    input:focus,
    select:focus {
      border-color: #d9a928;
      box-shadow: 0 0 12px rgba(218, 169, 40, 0.15);
    }

    input::placeholder {
      color: #666;
    }

    /* CHECK BUTTON */

    .check-btn {
      width: 100%;
      margin-top: 5px;

      border: none;
      border-radius: 13px;

      padding: 16px;

      background: linear-gradient(135deg, #ffe27a, #c59620, #9b6f08);
      color: #080808;

      font-size: 16px;
      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 8px 25px rgba(218, 169, 40, 0.18);

      transition: 0.2s;
    }

    .check-btn:hover {
      filter: brightness(1.08);
    }

    .check-btn:active {
      transform: scale(0.98);
    }

    .check-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* MESSAGE */

    .message {
      display: none;
      margin-top: 16px;

      padding: 13px;
      border-radius: 11px;

      text-align: center;
      font-size: 13px;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: rgba(40, 180, 90, 0.12);
      border: 1px solid rgba(70, 210, 120, 0.25);
      color: #8dffb3;
    }

    .message.error {
      background: rgba(220, 50, 50, 0.12);
      border: 1px solid rgba(220, 70, 70, 0.25);
      color: #ff9c9c;
    }

    /* RESULT */

    .result {
      display: none;
      margin-top: 18px;

      background: #090909;
      border: 1px solid #4b390e;
      border-radius: 15px;
      padding: 17px;
    }

    .result.show {
      display: block;
    }

    .result-title {
      color: #ffd45a;
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 16px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;

      padding: 11px 0;
      border-bottom: 1px solid #222;
      font-size: 13px;
    }

    .row:last-child {
      border-bottom: none;
    }

    .row span:first-child {
      color: #777;
    }

    .row span:last-child {
      color: #eee;
      font-weight: bold;
      text-align: right;
      word-break: break-word;
    }

    /* SUPPORT */

    .support {
      margin-top: 18px;

      padding: 18px;

      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          rgba(184, 134, 11, 0.14),
          rgba(0, 0, 0, 0.2)
        );

      border: 1px solid #4e3a0c;
      text-align: center;
    }

    .support-icon {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .support h3 {
      color: #ffd45a;
      font-size: 16px;
      margin-bottom: 7px;
    }

    .support p {
      color: #999;
      font-size: 12px;
      line-height: 1.6;
    }

    .phone {
      display: inline-block;
      margin-top: 10px;

      color: #ffe079;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
      text-decoration: none;
    }

    .phone:hover {
      text-decoration: underline;
    }

    /* FOOTER */

    .footer {
      text-align: center;
      padding: 22px 5px 10px;
      color: #555;
      font-size: 11px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 380px) {
      .header h1 {
        font-size: 27px;
      }

      .card {
        padding: 17px;
      }

      .game-btn {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->

    <div class="header">

      <div class="logo">
        XNZ
      </div>

      <h1>XNZ CHECK</h1>

      <p>Game ID Checker</p>

    </div>


    <!-- CHECKER -->

    <div class="card">

      <div class="title">
        CHECK PLAYER ID
      </div>


      <!-- GAME -->

      <div class="games">

        <button
          type="button"
          id="mlBtn"
          class="game-btn active"
        >
          MOBILE LEGENDS
        </button>

        <button
          type="button"
          id="ffBtn"
          class="game-btn"
        >
          FREE FIRE
        </button>

      </div>


      <!-- MLBB -->

      <div id="mlForm">

        <div class="form-group">

          <label for="mlId">
            USER ID
          </label>

          <input
            id="mlId"
            type="text"
            inputmode="numeric"
            placeholder="Masukkan User ID"
            autocomplete="off"
          >

        </div>


        <div class="form-group">

          <label for="mlZone">
            ZONE ID
          </label>

          <input
            id="mlZone"
            type="text"
            inputmode="numeric"
            placeholder="Masukkan Zone ID"
            autocomplete="off"
          >

        </div>

      </div>


      <!-- FREE FIRE -->

      <div
        id="ffForm"
        class="hidden"
      >

        <div class="form-group">

          <label for="ffId">
            PLAYER ID
          </label>

          <input
            id="ffId"
            type="text"
            inputmode="numeric"
            placeholder="Masukkan Player ID"
            autocomplete="off"
          >

        </div>


        <div class="form-group">

          <label for="ffServer">
            SERVER
          </label>

          <select id="ffServer">

            <option value="SG">
              Singapore (SG)
            </option>

            <option value="ID">
              Indonesia (ID)
            </option>

          </select>

        </div>

      </div>


      <!-- CHECK -->

      <button
        type="button"
        id="checkBtn"
        class="check-btn"
      >
        CHECK ID
      </button>


      <!-- MESSAGE -->

      <div
        id="message"
        class="message"
      ></div>


      <!-- RESULT -->

      <div
        id="result"
        class="result"
      >

        <div class="result-title">
          ✓ PLAYER FOUND
        </div>


        <div class="row">
          <span>GAME</span>
          <span id="resultGame">-</span>
        </div>


        <div class="row">
          <span>ID</span>
          <span id="resultId">-</span>
        </div>


        <div class="row">
          <span>SERVER / ZONE</span>
          <span id="resultServer">-</span>
        </div>


        <div class="row">
          <span>NICKNAME</span>
          <span id="resultName">-</span>
        </div>


        <div
          id="levelRow"
          class="row hidden"
        >
          <span>LEVEL</span>
          <span id="resultLevel">-</span>
        </div>

      </div>

    </div>


    <!-- SUPPORT -->

    <div class="support">

      <div class="support-icon">
        🛠️
      </div>

      <h3>
        PERTANYAAN / REPORT BUG
      </h3>

      <p>
        Jika terdapat masalah, bug atau error
        pada website, sila hubungi nombor di bawah.
      </p>

      <a
        class="phone"
        href="tel:0143783301"
      >
        📞 0143783301
      </a>

    </div>


    <!-- FOOTER -->

    <div class="footer">
      XNZ CHECK © 2026
    </div>

  </div>


  <!-- JAVASCRIPT -->

  <script>

    let currentGame = "ml";


    const mlBtn =
      document.getElementById("mlBtn");

    const ffBtn =
      document.getElementById("ffBtn");

    const mlForm =
      document.getElementById("mlForm");

    const ffForm =
      document.getElementById("ffForm");

    const checkBtn =
      document.getElementById("checkBtn");

    const message =
      document.getElementById("message");

    const result =
      document.getElementById("result");


    /* RESULT ELEMENTS */

    const resultGame =
      document.getElementById("resultGame");

    const resultId =
      document.getElementById("resultId");

    const resultServer =
      document.getElementById("resultServer");

    const resultName =
      document.getElementById("resultName");

    const resultLevel =
      document.getElementById("resultLevel");

    const levelRow =
      document.getElementById("levelRow");


    /* =========================
       GAME ML
    ========================= */

    mlBtn.addEventListener("click", () => {

      currentGame = "ml";

      mlBtn.classList.add("active");
      ffBtn.classList.remove("active");

      mlForm.classList.remove("hidden");
      ffForm.classList.add("hidden");

      clearAll();

    });


    /* =========================
       GAME FF
    ========================= */

    ffBtn.addEventListener("click", () => {

      currentGame = "ff";

      ffBtn.classList.add("active");
      mlBtn.classList.remove("active");

      ffForm.classList.remove("hidden");
      mlForm.classList.add("hidden");

      clearAll();

    });


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message show " + type;

    }


    function clearMessage() {

      message.textContent = "";

      message.className = "message";

    }


    /* =========================
       RESULT
    ========================= */

    function clearResult() {

      result.classList.remove("show");

      resultGame.textContent = "-";
      resultId.textContent = "-";
      resultServer.textContent = "-";
      resultName.textContent = "-";
      resultLevel.textContent = "-";

      levelRow.classList.add("hidden");

    }


    function clearAll() {

      clearMessage();
      clearResult();

    }


    /* =========================
       CHECK
    ========================= */

    checkBtn.addEventListener(
      "click",
      async () => {

        clearAll();


        let payload;


        /* MLBB */

        if (currentGame === "ml") {

          const id =
            document
              .getElementById("mlId")
              .value
              .trim();

          const zone =
            document
              .getElementById("mlZone")
              .value
              .trim();


          if (!id) {

            showMessage(
              "Sila masukkan User ID.",
              "error"
            );

            return;
          }


          if (!zone) {

            showMessage(
              "Sila masukkan Zone ID.",
              "error"
            );

            return;
          }


          payload = {

            game: "ml",

            id: id,

            zone: zone

          };

        }


        /* FREE FIRE */

        if (currentGame === "ff") {

          const id =
            document
              .getElementById("ffId")
              .value
              .trim();

          const server =
            document
              .getElementById("ffServer")
              .value;


          if (!id) {

            showMessage(
              "Sila masukkan Player ID.",
              "error"
            );

            return;
          }


          if (!/^[0-9]+$/.test(id)) {

            showMessage(
              "Player ID mesti nombor sahaja.",
              "error"
            );

            return;
          }


          payload = {

            game: "ff",

            id: id,

            playerId: id,

            server: server

          };

        }


        /* LOADING */

        checkBtn.disabled = true;

        checkBtn.textContent =
          "CHECKING...";


        try {

          const response =
            await fetch(
              "/api/checker",
              {

                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify(payload)

              }
            );


          const data =
            await response.json();


          if (
            !response.ok ||
            !data.success
          ) {

            throw new Error(
              data.message ||
              "ID tidak dapat disemak."
            );

          }


          /* RESULT */

          resultGame.textContent =
            data.game === "ff"
              ? "FREE FIRE"
              : "MOBILE LEGENDS";


          resultId.textContent =
            data.id || "-";


          resultServer.textContent =
            data.server || "-";


          resultName.textContent =
            data.name || "-";


          if (data.level) {

            resultLevel.textContent =
              data.level;

            levelRow.classList.remove(
              "hidden"
            );

          }


          result.classList.add("show");


          showMessage(
            "Player berjaya dijumpai!",
            "success"
          );


        } catch (error) {

          showMessage(
            error.message ||
            "Tidak dapat menyemak ID.",
            "error"
          );

        }


        checkBtn.disabled = false;

        checkBtn.textContent =
          "CHECK ID";

      }
    );

  </script>

</body>
  </html>
