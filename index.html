<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XNZ Check</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080b12;
  color: white;
}

.container {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.box {
  width: 100%;
  max-width: 430px;
  background: #111722;
  border: 1px solid #263044;
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 15px 40px rgba(0,0,0,.4);
}

.logo {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #8e9ab0;
  margin-bottom: 25px;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.tab {
  flex: 1;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  background: #202838;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.tab.active {
  background: #1683ff;
}

.form {
  display: none;
}

.form.active {
  display: block;
}

label {
  display: block;
  margin: 13px 0 7px;
  color: #cbd3e1;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #344057;
  background: #080d16;
  color: white;
  outline: none;
  font-size: 16px;
}

input:focus {
  border-color: #1683ff;
}

.check-btn {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #1683ff;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.check-btn:disabled {
  opacity: .6;
}

.result {
  margin-top: 20px;
  padding: 15px;
  border-radius: 12px;
  background: #080d16;
  border: 1px solid #263044;
  display: none;
}

.result.show {
  display: block;
}

.row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 8px 0;
  border-bottom: 1px solid #202838;
}

.row:last-child {
  border-bottom: 0;
}

.key {
  color: #8e9ab0;
}

.value {
  text-align: right;
  font-weight: bold;
}

.error {
  color: #ff7070;
}

.success {
  color: #65e89a;
}

.footer {
  text-align: center;
  color: #68748a;
  font-size: 12px;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">
  <div class="box">

    <div class="logo">XNZ CHECK</div>
    <div class="subtitle">Game ID Checker</div>

    <div class="tabs">
      <button class="tab active" onclick="showGame('mlbb')">
        Mobile Legends
      </button>

      <button class="tab" onclick="showGame('ff')">
        Free Fire
      </button>
    </div>

    <!-- MLBB -->
    <div id="mlbbForm" class="form active">

      <label>Mobile Legends User ID</label>
      <input
        id="mlbbId"
        type="text"
        inputmode="numeric"
        placeholder="Contoh: 123456789"
      >

      <label>Zone ID / Server ID</label>
      <input
        id="mlbbZone"
        type="text"
        inputmode="numeric"
        placeholder="Contoh: 1234"
      >

      <button class="check-btn" onclick="checkMLBB()">
        🔍 CHECK MLBB
      </button>

    </div>

    <!-- FREE FIRE -->
    <div id="ffForm" class="form">

      <label>Free Fire Player ID</label>
      <input
        id="ffId"
        type="text"
        inputmode="numeric"
        placeholder="Contoh: 1234567890"
      >

      <button class="check-btn" onclick="checkFF()">
        🔍 CHECK FREE FIRE
      </button>

    </div>

    <div id="result" class="result"></div>

    <div class="footer">
      XNZ Check • MLBB & Free Fire
    </div>

  </div>
</div>

<script>

let currentGame = "mlbb";

function showGame(game) {

  currentGame = game;

  document
    .getElementById("mlbbForm")
    .classList.toggle("active", game === "mlbb");

  document
    .getElementById("ffForm")
    .classList.toggle("active", game === "ff");

  const tabs = document.querySelectorAll(".tab");

  tabs[0].classList.toggle("active", game === "mlbb");
  tabs[1].classList.toggle("active", game === "ff");

  document.getElementById("result").classList.remove("show");
}


async function checkMLBB() {

  const userId = document.getElementById("mlbbId").value.trim();
  const zoneId = document.getElementById("mlbbZone").value.trim();

  if (!userId || !zoneId) {
    showError("Sila masukkan User ID dan Zone ID.");
    return;
  }

  await checkGame("mlbb", userId, zoneId);
}


async function checkFF() {

  const userId = document.getElementById("ffId").value.trim();

  if (!userId) {
    showError("Sila masukkan Player ID Free Fire.");
    return;
  }

  await checkGame("ff", userId, "");
}


async function checkGame(game, userId, zoneId) {

  const result = document.getElementById("result");

  result.className = "result show";
  result.innerHTML = `
    <div class="success">
      ⏳ Sedang semak ID...
    </div>
  `;

  const buttons = document.querySelectorAll(".check-btn");
  buttons.forEach(button => button.disabled = true);

  try {

    const response = await fetch("/api/checker", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        game: game,
        userId: userId,
        zoneId: zoneId
      })

    });

    const data = await response.json();

    if (!response.ok || data.success === false) {
      throw new Error(
        data.message || "ID tidak dijumpai."
      );
    }

    result.innerHTML = `

      <div class="row">
        <span class="key">Game</span>
        <span class="value">${escapeHTML(data.game || game)}</span>
      </div>

      <div class="row">
        <span class="key">ID</span>
        <span class="value">${escapeHTML(data.id || userId)}</span>
      </div>

      ${
        data.server
        ? `
        <div class="row">
          <span class="key">Zone / Server</span>
          <span class="value">${escapeHTML(data.server)}</span>
        </div>
        `
        : ""
      }

      <div class="row">
        <span class="key">Nickname</span>
        <span class="value success">
          ${escapeHTML(data.name || "Tidak diketahui")}
        </span>
      </div>

      ${
        data.country
        ? `
        <div class="row">
          <span class="key">Country</span>
          <span class="value">${escapeHTML(data.country)}</span>
        </div>
        `
        : ""
      }

    `;

  } catch (error) {

    showError(
      error.message || "Server API sedang bermasalah."
    );

  } finally {

    buttons.forEach(button => button.disabled = false);

  }
}


function showError(message) {

  const result = document.getElementById("result");

  result.className = "result show";

  result.innerHTML = `
    <div class="error">
      ❌ ${escapeHTML(message)}
    </div>
  `;
}


function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
