<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XNZ CHECK</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #080b16, #111827, #05070d);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: rgba(20, 25, 40, 0.95);
      border: 1px solid #293247;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }

    .logo {
      text-align: center;
      margin-bottom: 8px;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: #1f2937;
      color: #9ca3af;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .tab.active {
      background: #2563eb;
      color: white;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #d1d5db;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 11px;
      border: 1px solid #374151;
      background: #111827;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
    }

    select {
      appearance: auto;
    }

    .check-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 11px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .check-btn:hover {
      background: #1d4ed8;
    }

    .check-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      display: none;
      margin-top: 22px;
      padding: 18px;
      border-radius: 14px;
      background: #111827;
      border: 1px solid #374151;
    }

    .result.show {
      display: block;
    }

    .result-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 9px 0;
      border-bottom: 1px solid #273244;
    }

    .result-row:last-child {
      border-bottom: none;
    }

    .result-label {
      color: #9ca3af;
    }

    .result-value {
      font-weight: bold;
      text-align: right;
      word-break: break-word;
    }

    .error {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 11px;
      background: #3f1515;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      font-size: 14px;
      text-align: center;
    }

    .error.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 15px;
      color: #93c5fd;
      font-size: 14px;
    }

    .loading.show {
      display: block;
    }

    .footer {
      text-align: center;
      color: #6b7280;
      font-size: 12px;
      margin-top: 22px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">XNZ CHECK</div>

    <div class="subtitle">
      Game ID Checker
    </div>

    <div class="tabs">
      <button class="tab active" onclick="showGame('mlbb')">
        MOBILE LEGENDS
      </button>

      <button class="tab" onclick="showGame('ff')">
        FREE FIRE
      </button>
    </div>

    <!-- ========================= -->
    <!-- MOBILE LEGENDS -->
    <!-- ========================= -->

    <div id="mlbbForm" class="form active">

      <label for="mlbbId">
        Mobile Legends User ID
      </label>

      <input
        id="mlbbId"
        type="text"
        inputmode="numeric"
        placeholder="Contoh: 123456789"
      >

      <label for="zoneId">
        Zone ID
      </label>

      <input
        id="zoneId"
        type="text"
        inputmode="numeric"
        placeholder="Contoh: 1234"
      >

      <button class="check-btn" onclick="checkMLBB()">
        🔍 CHECK MOBILE LEGENDS
      </button>

    </div>


    <!-- ========================= -->
    <!-- FREE FIRE -->
    <!-- ========================= -->

    <div id="ffForm" class="form">

      <label for="ffId">
        Free Fire Player ID
      </label>

      <input
        id="ffId"
        type="text"
        inputmode="numeric"
        placeholder="Contoh: 1234567890"
      >

      <label for="ffServer">
        Free Fire Server
      </label>

      <select id="ffServer">
        <option value="SG">Singapore (SG)</option>
        <option value="ID">Indonesia (ID)</option>
      </select>

      <button class="check-btn" onclick="checkFF()">
        🔍 CHECK FREE FIRE
      </button>

    </div>


    <div id="loading" class="loading">
      ⏳ Sedang semak ID...
    </div>

    <div id="error" class="error"></div>

    <div id="result" class="result">

      <div class="result-title">
        ✅ Maklumat Akaun
      </div>

      <div class="result-row">
        <span class="result-label">Game</span>
        <span class="result-value" id="resultGame">-</span>
      </div>

      <div class="result-row">
        <span class="result-label">ID</span>
        <span class="result-value" id="resultId">-</span>
      </div>

      <div class="result-row">
        <span class="result-label">Server</span>
        <span class="result-value" id="resultServer">-</span>
      </div>

      <div class="result-row">
        <span class="result-label">Nickname</span>
        <span class="result-value" id="resultName">-</span>
      </div>

    </div>

    <div class="footer">
      XNZ CHECK © 2026
    </div>

  </div>


  <script>

    function showGame(game) {

      const mlbbForm = document.getElementById("mlbbForm");
      const ffForm = document.getElementById("ffForm");
      const tabs = document.querySelectorAll(".tab");

      hideMessages();

      if (game === "mlbb") {

        mlbbForm.classList.add("active");
        ffForm.classList.remove("active");

        tabs[0].classList.add("active");
        tabs[1].classList.remove("active");

      } else {

        mlbbForm.classList.remove("active");
        ffForm.classList.add("active");

        tabs[0].classList.remove("active");
        tabs[1].classList.add("active");

      }
    }


    function showLoading(show) {

      const loading = document.getElementById("loading");

      if (show) {
        loading.classList.add("show");
      } else {
        loading.classList.remove("show");
      }
    }


    function showError(message) {

      const error = document.getElementById("error");

      error.textContent = "❌ " + message;
      error.classList.add("show");

    }


    function hideMessages() {

      document.getElementById("error").classList.remove("show");
      document.getElementById("result").classList.remove("show");

    }


    function showResult(data) {

      document.getElementById("resultGame").textContent =
        data.game === "mlbb" ? "Mobile Legends" : "Free Fire";

      document.getElementById("resultId").textContent =
        data.id || "-";

      document.getElementById("resultServer").textContent =
        data.server || "-";

      document.getElementById("resultName").textContent =
        data.name || "-";

      document.getElementById("result").classList.add("show");

    }


    async function checkMLBB() {

      const userId =
        document.getElementById("mlbbId").value.trim();

      const zoneId =
        document.getElementById("zoneId").value.trim();

      hideMessages();

      if (!userId) {

        showError("Sila masukkan User ID Mobile Legends.");
        return;

      }

      if (!zoneId) {

        showError("Sila masukkan Zone ID Mobile Legends.");
        return;

      }

      await checkGame(
        "mlbb",
        userId,
        zoneId,
        ""
      );

    }


    async function checkFF() {

      const userId =
        document.getElementById("ffId").value.trim();

      const server =
        document.getElementById("ffServer").value;

      hideMessages();

      if (!userId) {

        showError("Sila masukkan Player ID Free Fire.");
        return;

      }

      await checkGame(
        "ff",
        userId,
        "",
        server
      );

    }


    async function checkGame(
      game,
      userId,
      zoneId,
      server
    ) {

      showLoading(true);

      try {

        const response = await fetch("/api/checker", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            game: game,
            userId: userId,
            zoneId: zoneId,
            server: server

          })

        });


        const data = await response.json();


        if (!response.ok || !data.success) {

          showError(
            data.message || "ID tidak dijumpai."
          );

          return;

        }


        showResult(data);

      } catch (error) {

        showError(
          "Tidak dapat sambung ke server API."
        );

      } finally {

        showLoading(false);

      }

    }

  </script>

</body>
</html>
